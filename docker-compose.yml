services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lomi
      POSTGRES_PASSWORD: lomi
      POSTGRES_DB: lomi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lomi -d lomi"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://lomi:lomi@postgres:5432/lomi
      REDIS_URL: redis://redis:6379
      PORT: 3001
      STORAGE_DIR: /data/documents
      FIXTURES_DIR: /app/fixtures
      MOCK_LLM: ${MOCK_LLM:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - docstorage:/data/documents
      - ./fixtures:/app/fixtures:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ["node", "apps/api/dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://lomi:lomi@postgres:5432/lomi
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/documents
      FIXTURES_DIR: /app/fixtures
      MOCK_LLM: ${MOCK_LLM:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - docstorage:/data/documents
      - ./fixtures:/app/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  docstorage: